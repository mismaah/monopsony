# Generates TypeScript types from the Go protocol/engine structs.
# Run: task gen   (or: cd server && go run github.com/gzuidhof/tygo@v0.2.18 generate)
packages:
  - path: "monopsony/server/internal/game"
    output_path: "../packages/protocol/src/game.ts"
    exclude_files:
      - "engine.go"
      - "actions.go"
      - "rng.go"
      - "invariants.go"
      - "classic.go"
      - "commands.go"
    type_mappings:
      json.RawMessage: "unknown"
    frontmatter: |
      // GENERATED by tygo from server/internal/game — do not edit.
      /* eslint-disable */
  - path: "monopsony/server/internal/protocol"
    output_path: "../packages/protocol/src/protocol.ts"
    type_mappings:
      json.RawMessage: "unknown"
      game.Rules: "Rules"
      game.Config: "Config"
      game.State: "State"
      game.Action: "Action"
    frontmatter: |
      // GENERATED by tygo from server/internal/protocol — do not edit.
      /* eslint-disable */
      import type { Rules, Config, State, Action } from "./game";
