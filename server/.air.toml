# Live reload for the Go server: `task server` (or `cd server && air`).
# Builds to a fixed path (bin/server.exe) rather than go run's per-launch temp
# binary, so Windows Firewall only ever sees one executable. Pair with the
# 127.0.0.1 bind addresses in .env and the firewall prompt never appears.
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "bin/server.exe"
  cmd = "go build -o bin/server.exe ./cmd/server && go run github.com/gzuidhof/tygo@v0.2.18 generate"
  delay = 0
  exclude_dir = ["bin", "tmp", "data", "migrations", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = true
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
