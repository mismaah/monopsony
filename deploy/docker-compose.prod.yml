# Production stack: the Monopsony image + Redis, reusing the Postgres container
# and the cloudflared already running on the box (Cloudflare terminates TLS; the
# origin is never reachable from the internet directly).
# Settings come from deploy/.env (see .env.example).
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# The app reaches Postgres through the host gateway (host.docker.internal), i.e.
# the port that container publishes on the host — which works wherever Postgres
# sits, including the default bridge network. To go container-to-container
# instead, see "Talking to Postgres" in the README.
#
# The app listens on the host's loopback only (127.0.0.1:8080): point the
# tunnel's public hostname at http://localhost:8080 and nothing on the LAN can
# bypass Cloudflare.
#
# `--scale app=3` runs several nodes (each takes the next loopback port; games
# are reachable from any node through Redis, so no sticky sessions).
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      # host.docker.internal = the host as seen from this container (Linux needs
      # this line; Docker Desktop provides the name anyway).
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080-8089:8080"
    volumes:
      - media:/app/data/assets
    environment:
      MONOPSONY_DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?}?sslmode=${POSTGRES_SSLMODE:-disable}
      MONOPSONY_REDIS_URL: redis://redis:6379/0
      MONOPSONY_ASSET_DIR: /app/data/assets
      MONOPSONY_METRICS_ADDR: ":9100"
      # cloudflared is the only thing that can reach the port and it sets
      # X-Forwarded-For to the visitor.
      MONOPSONY_TRUST_PROXY: ${MONOPSONY_TRUST_PROXY:-1}
      MONOPSONY_LOG_FORMAT: json
      MONOPSONY_ADS_PROVIDER: ${MONOPSONY_ADS_PROVIDER:-house}
      MONOPSONY_ADSENSE_CLIENT: ${MONOPSONY_ADSENSE_CLIENT:-}
      MONOPSONY_ADSENSE_SLOT: ${MONOPSONY_ADSENSE_SLOT:-}
      MONOPSONY_JWT_SECRET: ${MONOPSONY_JWT_SECRET:?set a long random secret}
      MONOPSONY_PUBLIC_URL: ${MONOPSONY_PUBLIC_URL:?https://<tunnel hostname>}
      MONOPSONY_CORS_ORIGINS: ${MONOPSONY_PUBLIC_URL}
      MONOPSONY_ADMIN_EMAILS: ${MONOPSONY_ADMIN_EMAILS:-}
      MONOPSONY_BILLING_PROVIDER: ${MONOPSONY_BILLING_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    restart: unless-stopped

volumes:
  media:
