# Dev dependencies only: run the Go server and the Vite apps on the host.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monopsony
      POSTGRES_PASSWORD: monopsony
      POSTGRES_DB: monopsony
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monopsony"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: set MONOPSONY_REDIS_URL=redis://localhost:6379/0 on two server
  # processes (different MONOPSONY_ADDR) to try the multi-node mode locally.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
